services:
  ollama:
    image: ollama/ollama:0.40.5
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.40.5
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${MODEL:-qwen3.5:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL=${MODEL:-qwen3.5:4b}
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
